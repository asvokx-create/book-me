name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookme
          POSTGRES_PASSWORD: bookme
          POSTGRES_DB: bookme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookme -d bookme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BETTER_AUTH_SECRET: local-ci-validation-secret-at-least-32-characters
      DATABASE_URL: postgresql://bookme:bookme@127.0.0.1:5432/bookme
      DATABASE_CA_CERT: local-ci-placeholder
      RESEND_API_KEY: local-ci-placeholder
      EMAIL_FROM: BubsBookings <security-ci@example.com>
      BOOKME_MIGRATION_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run security:node-runtime
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:booking-fee-migration
      - run: npm run lint
      - run: npm run build
